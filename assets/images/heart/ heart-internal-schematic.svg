<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">Kalbin iç anatomisi - şematik çizim</title>
<desc id="desc">Atriumlar, ventriküller, kapaklar, papiller kaslar ve interventriküler septumu temsil eden özgün eğitim şeması.</desc>
<defs>
  <linearGradient id="wall" x1="0" x2="1"><stop offset="0" stop-color="#e8a0a0"/><stop offset="1" stop-color="#bd5b68"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#9cc9e7"/><stop offset="1" stop-color="#4c8dbb"/></linearGradient>
  <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#f3b1a9"/><stop offset="1" stop-color="#d66b70"/></linearGradient>
</defs>
<rect width="1000" height="700" rx="28" fill="#f8fbfd"/>
<path d="M500 110 C390 45 220 105 205 250 C180 420 350 590 500 650 C650 590 820 420 795 250 C780 105 610 45 500 110Z" fill="url(#wall)" stroke="#8e4653" stroke-width="18"/>
<!-- right atrium (left side of image) -->
<path d="M250 175 Q330 115 450 175 L455 325 Q360 355 250 300Z" fill="url(#blue)" stroke="#315f80" stroke-width="10"/>
<!-- left atrium -->
<path d="M550 175 Q670 115 750 175 L750 300 Q640 355 545 325Z" fill="url(#red)" stroke="#984d58" stroke-width="10"/>
<!-- ventricles -->
<path d="M250 345 Q350 310 455 350 L480 570 Q360 610 275 480Z" fill="url(#blue)" stroke="#315f80" stroke-width="10"/>
<path d="M545 350 Q650 310 750 345 L725 480 Q640 610 520 570Z" fill="url(#red)" stroke="#984d58" stroke-width="10"/>
<!-- septum -->
<path d="M492 325 Q470 440 500 585 Q530 440 508 325Z" fill="#d9a2a0" stroke="#8e4653" stroke-width="9"/>
<!-- fossa ovalis -->
<ellipse cx="350" cy="245" rx="36" ry="25" fill="#e5f2fa" stroke="#376d92" stroke-width="9"/>
<!-- pectinate ridges -->
<g stroke="#234f70" stroke-width="9" stroke-linecap="round">
 <path d="M275 185 Q295 220 285 285"/><path d="M305 175 Q325 220 315 295"/>
 <path d="M335 170 Q355 220 345 300"/><path d="M365 170 Q385 220 375 300"/>
 <path d="M395 180 Q415 220 405 300"/>
</g>
<!-- tricuspid and mitral leaflets -->
<path d="M275 330 Q330 360 385 330 M330 340 L310 390 M330 340 L355 390" fill="none" stroke="#244f6d" stroke-width="13" stroke-linecap="round"/>
<path d="M610 330 Q665 360 720 330 M665 340 L645 390 M665 340 L690 390" fill="none" stroke="#8d3f4c" stroke-width="13" stroke-linecap="round"/>
<!-- chordae -->
<g stroke="#f7f2e9" stroke-width="6" fill="none">
 <path d="M310 390 L330 465 M355 390 L350 470 M645 390 L650 465 M690 390 L680 470"/>
</g>
<!-- papillary muscles -->
<g fill="#315f80" stroke="#244f6d" stroke-width="5">
 <path d="M300 490 Q325 425 350 490Z"/><path d="M360 500 Q380 430 405 500Z"/>
</g>
<g fill="#984d58" stroke="#7c3541" stroke-width="5">
 <path d="M610 500 Q635 425 660 500Z"/><path d="M670 490 Q695 430 720 490Z"/>
</g>
<!-- trabeculae -->
<g stroke="#244f6d" stroke-width="8" fill="none" stroke-linecap="round">
 <path d="M285 425 Q315 450 300 475"/><path d="M390 420 Q410 450 390 475"/>
 <path d="M285 455 Q320 470 325 500"/><path d="M395 465 Q420 480 410 510"/>
</g>
<g fill="#5c6873" font-family="Arial, sans-serif" font-size="24" font-weight="600">
 <text x="90" y="90">SAĞ KALP</text><text x="760" y="90">SOL KALP</text>
 <text x="310" y="640" font-size="18" font-weight="400">Şematik gösterim • Ölçekli değildir</text>
</g>
</svg>
